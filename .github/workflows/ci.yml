name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      web: ${{ steps.d.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          if compgen -G "backend/*.sln" >/dev/null || compgen -G "backend/*.slnx" >/dev/null; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f web/package.json ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    name: backend
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror -c Release
      - run: dotnet format --verify-no-changes --no-restore
      # Integration tests use Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  web:
    name: web
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required status check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [detect, backend, web, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo "detect=${{ needs.detect.result }} backend=${{ needs.backend.result }} web=${{ needs.web.result }} secrets=${{ needs.secrets.result }}"
          for r in "${{ needs.detect.result }}" "${{ needs.backend.result }}" "${{ needs.web.result }}" "${{ needs.secrets.result }}"; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job did not succeed ($r)"; exit 1 ;; esac
          done
