name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            revert
          requireScope: false

  risk:
    name: risk label
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Classify and label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          out=$(bash .claude/scripts/pr-risk.sh "$PR")
          level=$(echo "$out" | head -1)
          echo "$out"
          if [ "$level" = "high" ]; then
            gh pr edit "$PR" --add-label risk:high --remove-label risk:low
          else
            gh pr edit "$PR" --add-label risk:low --remove-label risk:high
          fi
          {
            echo "### Risk: $level"
            echo '```'
            echo "$out" | tail -n +2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
